name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Install dependencies
        run: node ./scripts/ci-install.mjs
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run pack:check
      - run: npm audit --omit=dev

  package-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Install dependencies
        run: node ./scripts/ci-install.mjs
      - run: npm run build
      - run: npm pack
      - name: Install packed package in a clean temporary project
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp pi-signal-board-0.1.0.tgz "$work/"
          cd "$work"
          npm init -y >/dev/null
          npm install --ignore-scripts ./pi-signal-board-0.1.0.tgz @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1 typebox@1.3.7
          node -e "import('pi-signal-board').then(m => { if (typeof m.default !== 'function') process.exit(1) })"
