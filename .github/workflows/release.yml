name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        shell: bash
        run: node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v'+p.version) { throw new Error('Tag '+tag+' does not match v'+p.version); }"
      - name: Require committed production lockfile
        shell: bash
        run: |
          test -f package-lock.json
          test ! -f .lockfile-bootstrap.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run pack:check
      - run: npm audit --omit=dev
      - run: npm publish --access public
